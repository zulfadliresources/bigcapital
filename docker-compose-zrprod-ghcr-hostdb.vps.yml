# VPS Production Override for HostDB Setup
# Usage: docker-compose -f docker-compose-zrprod-ghcr-hostdb.yml -f docker-compose-zrprod-ghcr-hostdb.vps.yml up -d

services:
  backup:
    # user: "zulfa5798:zulfa5798"  # Commented out - will create user in script
    volumes:
      # Use VPS backup directory with proper permissions
      - backup_data:/backups
      - /home/zulfadli.com/backups/bigcapital:/host-backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backups:/repo-backups:ro
    environment:
      # Ensure backup script runs with correct permissions
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_SCHEDULE=17 * * * *
      - DB_HOST=host.docker.internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Create zulfa5798 user with matching host UID/GID
        if ! id -u zulfa5798 > /dev/null 2>&1; then
            # Get UID/GID from the host backup directory
            HOST_UID=$(stat -c '%u' /host-backups 2>/dev/null || echo "1000")
            HOST_GID=$(stat -c '%g' /host-backups 2>/dev/null || echo "1000")
            
            # Create group if it doesn't exist
            if ! getent group $HOST_GID > /dev/null 2>&1; then
                groupadd -g $HOST_GID zulfa5798 2>/dev/null || true
            fi
            
            # Create user with matching UID/GID
            useradd -u $HOST_UID -g $HOST_GID -M -s /bin/bash zulfa5798 2>/dev/null || \
            echo "Warning: Could not create user zulfa5798 with UID $HOST_UID, proceeding with root permissions"
        fi
        
        # Ensure backup directory exists and has correct permissions
        mkdir -p /host-backups
        if id -u zulfa5798 > /dev/null 2>&1; then
            chown -R zulfa5798:zulfa5798 /host-backups 2>/dev/null || true
        else
            # Fallback to numeric IDs if user creation failed
            HOST_UID=$(stat -c '%u' /host-backups 2>/dev/null || echo "1000")
            HOST_GID=$(stat -c '%g' /host-backups 2>/dev/null || echo "1000")
            chown -R $HOST_UID:$HOST_GID /host-backups 2>/dev/null || true
        fi
        chmod -R 755 /host-backups
        
        # Install required packages
        apt-get update && apt-get install -y cron mysql-client docker.io && rm -rf /var/lib/apt/lists/*
        
        # Copy manual backup scripts from repo if they exist
        if [ -d "/repo-backups" ]; then
          cp /repo-backups/*.sh /host-backups/ 2>/dev/null || true
          chmod +x /host-backups/*.sh 2>/dev/null || true
        fi
        
        # Create backup script
        cat > /usr/local/bin/backup.sh << 'BACKUP_SCRIPT'
        #!/bin/bash
        BACKUP_DIR="/backups"
        TIMESTAMP=$$(date +"%Y%m%d_%H%M%S")
        LOG_FILE="$$BACKUP_DIR/backup_$$(date +%Y%m%d).log"
        
        # Get host UID/GID for file ownership
        HOST_UID=$$(stat -c '%u' /host-backups 2>/dev/null || echo "1000")
        HOST_GID=$$(stat -c '%g' /host-backups 2>/dev/null || echo "1000")
        BACKUP_RETENTION_DAYS=$${BACKUP_RETENTION_DAYS:-7}
        log "Host UID/GID: $$HOST_UID $$HOST_GID"
        
        log() { echo "[$$(date +'%Y-%m-%d %H:%M:%S')] $$1" | tee -a "$$LOG_FILE"; }
        
        # MySQL Backup (Host databases - separate system and tenant backups)
        log "MySQL backup note: Host databases backed up individually"
        
        # System database backup
        log "Backing up system database..."
        if mysqldump -h${DB_HOST} -u${DB_USER} -p${DB_PASSWORD} --single-transaction --routines --triggers --events bigcapital_system 2>/dev/null | gzip > "/host-backups/mariadb_bigcapital_system_$$TIMESTAMP.sql.gz"; then
            chown $HOST_UID:$HOST_GID "/host-backups/mariadb_bigcapital_system_$$TIMESTAMP.sql.gz" 2>/dev/null || true            log "Ownership after chown: $$(ls -l /host-backups/mariadb_bigcapital_system_$$TIMESTAMP.sql.gz | awk '{print $$3,$$4}')"            log "System database backup completed: mariadb_bigcapital_system_$$TIMESTAMP.sql.gz"
        else
            log "System database backup failed"
        fi
        
        # Tenant databases backup (individual files)
        log "Finding tenant databases..."
        ALL_DBS=$$(mysql -h$${DB_HOST} -u$${DB_USER} -p$${DB_PASSWORD} -e "SHOW DATABASES" 2>&1)
        log "All databases: $$ALL_DBS"
        # Fallback to hardcoded tenant DBs if query fails
        if echo "$$ALL_DBS" | grep -q "bigcapital_system"; then
            TENANT_DBS=$$(echo "$$ALL_DBS" | grep '^bigcapital_' | grep -v "bigcapital_system" | grep -v "Database")
        else
            TENANT_DBS="bigcapital_1 bigcapital_2 bigcapital_3"
            log "SHOW DATABASES failed, using hardcoded tenant DBs"
        fi
        log "Tenant DBs found: $$TENANT_DBS"
        
        if [ ! -z "$$TENANT_DBS" ]; then
            log "Found tenant databases: $$TENANT_DBS"
            for DB in $$TENANT_DBS; do
                log "Backing up tenant database: $$DB"
                if mysqldump -h${DB_HOST} -u${DB_USER} -p${DB_PASSWORD} --single-transaction --routines --triggers --events "$$DB" 2>/dev/null | gzip > "/host-backups/mariadb_$${DB}_$$TIMESTAMP.sql.gz"; then
                    chown $HOST_UID:$HOST_GID "/host-backups/mariadb_$${DB}_$$TIMESTAMP.sql.gz" 2>/dev/null || true
                    log "Tenant database $$DB backup completed: mariadb_$${DB}_$$TIMESTAMP.sql.gz"
                else
                    log "Tenant database $$DB backup failed"
                fi
            done
        else
            log "No tenant databases found"
        fi
        

        if docker exec bigcapital-mongo mongodump --db=bigcapital --archive --gzip 2>/dev/null > "$$BACKUP_DIR/mongo_$$TIMESTAMP.archive.gz"; then
            cp "$$BACKUP_DIR/mongo_$$TIMESTAMP.archive.gz" /host-backups/ 2>/dev/null || true
            chown $HOST_UID:$HOST_GID "/host-backups/mongo_$$TIMESTAMP.archive.gz" 2>/dev/null || true            log "Ownership after chown: $$(ls -l /host-backups/mongo_$$TIMESTAMP.archive.gz | awk '{print $$3,$$4}')"            log "MongoDB backup completed: mongo_$$TIMESTAMP.archive.gz ($$(du -h $$BACKUP_DIR/mongo_$$TIMESTAMP.archive.gz | cut -f1))"
        else
            log "MongoDB backup failed"
        fi
        
        # Cleanup old backups
        log "Cleaning up backups older than $$BACKUP_RETENTION_DAYS days..."
        find $$BACKUP_DIR -name "mongo_*.archive.gz" -type f -mtime +$$BACKUP_RETENTION_DAYS -delete
        find /host-backups -name "mongo_*.archive.gz" -type f -mtime +$$BACKUP_RETENTION_DAYS -delete 2>/dev/null || true
        find /host-backups -name "mariadb_*.sql.gz" -type f -mtime +$$BACKUP_RETENTION_DAYS -delete 2>/dev/null || true
        log "Backup completed. Total files: $$(ls -1 $$BACKUP_DIR/*.gz 2>/dev/null | wc -l)"
        BACKUP_SCRIPT
        
        chmod +x /usr/local/bin/backup.sh
        
        # Setup cron job
        echo "$$BACKUP_SCHEDULE /usr/local/bin/backup.sh >> /backups/cron.log 2>&1" > /etc/cron.d/backup-cron
        chmod 0644 /etc/cron.d/backup-cron
        crontab /etc/cron.d/backup-cron
        
        echo "✅ Backup service started!"
        echo "Schedule: $$BACKUP_SCHEDULE (hourly at :17)"
        echo "Backups stored: /backups (volume) and /home/zulfadli.com/backups/bigcapital (host)"
        echo "Owner: zulfa5798"
        echo "Permissions: 755 (owner full access, others read/execute)"
        echo ""
        echo "📋 Backup Coverage:"
        echo "  ✅ MongoDB: bigcapital (system data - attachments, sessions, etc.)"
        echo "  ✅ MySQL: bigcapital_system (system database)"
        echo "  ✅ MySQL: Individual tenant databases (bigcapital_{id})"
        echo ""
        echo "📁 Backup File Structure:"
        echo "  mongo_TIMESTAMP.archive.gz"
        echo "  mariadb_bigcapital_system_TIMESTAMP.sql.gz"
        echo "  mariadb_bigcapital_{tenant_id}_TIMESTAMP.sql.gz"
        echo ""
        echo "Run manual backup: docker exec bigcapital-backup /usr/local/bin/backup.sh"
        echo "View backups: ls -lh /home/zulfadli.com/backups/bigcapital/"
        
        # Keep container running and show cron logs
        touch /backups/cron.log
        cron && tail -f /backups/cron.log